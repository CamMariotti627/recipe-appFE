<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>View Recipes - Recipe App</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>

<nav>
    <a href="index.html">Home</a>
    <a href="view.html">View Recipes</a>
    <a href="add.html">Add Recipe</a>
    <a href="edit.html">Edit Recipe</a>
</nav>

<div class="container">
    <h1>All Recipes</h1>
    <h2> Browse your recipe collection below. </h2>
    <br>
    <div class="search-bar">
        <label for="search-input"><h3>Recipe name</h3></label>
        <input type="text" id="search-input" placeholder="Search recipes by name...">
        <br>
        <label for="search-input"><h3>Ingredients</h3></label>
        <input type="text" id="ingredient-input" placeholder="e.g. chicken, mushroom">
        <br>
        <label for="search-input"><h3>Dietary Restrictions/Allergies</h3></label>
        <input type="text" id="exclude-input" placeholder="e.g. shellfish, peanuts">
        <br>
        <br> 
        

        <button id="search-btn" class="btn">Search</button>
    </div>
    <br>
    

    <div id="recipe-list">
        <p>Recipes will load here.</p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
